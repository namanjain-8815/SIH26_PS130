# Optional convenience — DEVELOPER_GUIDE.md §1 says any Postgres 14+
# instance (local or hosted) works. Run `docker compose up -d` if you don't
# already have Postgres installed locally.
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
      POSTGRES_DB: sih_approvals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
